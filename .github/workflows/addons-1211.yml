name: JCM and MTR France - Fabric 1.21.1 ports

on:
  push:
    branches:
      - work/sillon-trio-fabric-1211
    paths:
      - .github/workflows/addons-1211.yml
      - tools/ports_1211/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jcm:
    name: JCM v2 - source compilation and assets-only prototype
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          path: sillon
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Clone pinned JCM v2 source
        run: |
          git clone https://github.com/DistrictOfJoban/Joban-Client-Mod.git jcm
          git -C jcm checkout fc502c4b45b581a4407aefb890c18691a3f34ea6
      - name: Apply Fabric 1.21.1 migration
        run: python3 sillon/tools/ports_1211/prepare_jcm.py jcm
      - name: Compile full source (may fail; save diagnostics)
        id: source_build
        continue-on-error: true
        working-directory: jcm
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew :fabric:build --no-daemon --stacktrace 2>&1 | tee ../jcm-1211.log
      - name: Save full JCM JARs only if actual compilation succeeded
        if: steps.source_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: JCM-1211-COMPILED-source-build
          path: jcm/fabric/build/libs/*.jar
          if-no-files-found: error
      - name: Create clearly marked nonfunctional JCM resource prototype
        run: |
          python3 sillon/tools/ports_1211/package_assets_only.py --source jcm --mod jcm --out JCM-1.21.1-ASSETS-ONLY-NONFUNCTIONAL.jar
          echo "NO JAVA CODE: this is NOT a working JCM port. DO NOT INSTALL IN AN EXISTING WORLD." > JCM-READ-ME-FIRST.txt
      - name: Upload JCM experimental resources
        uses: actions/upload-artifact@v4
        with:
          name: JCM-1211-NONFUNCTIONAL-ASSETS-ONLY
          path: |
            JCM-1.21.1-ASSETS-ONLY-NONFUNCTIONAL.jar
            JCM-READ-ME-FIRST.txt
          if-no-files-found: error
      - name: Upload JCM source compilation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JCM-1211-SOURCE-COMPILE-LOG
          path: jcm-1211.log
          if-no-files-found: ignore

  mtrfrance:
    name: MTR France - source compilation and assets-only prototype
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          path: sillon
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Clone pinned MTR France source
        run: |
          git clone https://github.com/MTR-France-Team/MTR-France-Addon.git mtrfrance
          git -C mtrfrance checkout eaf2a8130ac31f12534480a567c9246f35c0463e
      - name: Apply Fabric 1.21.1 migration
        run: python3 sillon/tools/ports_1211/prepare_mtrfrance.py mtrfrance
      - name: Compile full source (may fail; save diagnostics)
        id: source_build
        continue-on-error: true
        working-directory: mtrfrance
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew :1.21.1-fabric:build --no-daemon --stacktrace 2>&1 | tee ../mtrfrance-1211.log
      - name: Save full MTR France JARs only if actual compilation succeeded
        if: steps.source_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: MTRFrance-1211-COMPILED-source-build
          path: mtrfrance/versions/1.21.1-fabric/build/libs/*.jar
          if-no-files-found: error
      - name: Create clearly marked nonfunctional MTR France resource prototype
        run: |
          python3 sillon/tools/ports_1211/package_assets_only.py --source mtrfrance --mod mtrfrance --out MTRFrance-1.21.1-ASSETS-ONLY-NONFUNCTIONAL.jar
          echo "NO JAVA CODE: this is NOT a working MTR France port. DO NOT INSTALL IN AN EXISTING WORLD." > MTRFrance-READ-ME-FIRST.txt
      - name: Upload MTR France experimental resources
        uses: actions/upload-artifact@v4
        with:
          name: MTRFrance-1211-NONFUNCTIONAL-ASSETS-ONLY
          path: |
            MTRFrance-1.21.1-ASSETS-ONLY-NONFUNCTIONAL.jar
            MTRFrance-READ-ME-FIRST.txt
          if-no-files-found: error
      - name: Upload MTR France source compilation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MTRFrance-1211-SOURCE-COMPILE-LOG
          path: mtrfrance-1211.log
          if-no-files-found: ignore
