name: Sillon Chantier - Forge 1.20.1 and real construction QA
on:
  push:
    branches: [work/sillon-chantier-forge-1201, work/sillon-preview-fix-forge-1201]
    paths-ignore: [docs/**, .github/workflows/signage-preparation.yml, tools/prepare_signage_assets.py]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sillon-chantier-forge
  cancel-in-progress: true
jobs:
  forge:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - run: pip install pillow pymupdf
      - name: Complete real reference material and the offline map
        run: python tools/complete_signage_refs.py
      - name: Render and exercise the actual compositor and editor model
        run: python tools/test_sillon_signage_reference.py
      - name: Exercise all modular station families and navigation equipment
        run: python tools/test_station_decor.py
      - name: Publish QA images for review
        if: always()
        run: |
          mkdir -p docs/signage/review
          cp -r build/signage-qa/* docs/signage/review/ 2>/dev/null || true
          git config user.name "Sillon build"
          git config user.email "48333136+1GNTV@users.noreply.github.com"
          git add docs/signage fabric/src/main/resources/assets/mtr/signage
          git diff --cached --quiet || git commit -m "qa(signage): preserve real references and rendered panel review"
          git push origin HEAD:${{ github.ref_name }}
      - uses: actions/cache@v4
        id: website
        with:
          path: website/dist
          key: sillon-signage-website-1201-20261018
      - name: Website resources
        if: steps.website.outputs.cache-hit != 'true'
        run: |
          chmod +x gradlew
          ./gradlew fabric:setupWebsiteFiles -PminecraftVersion=1.20.1
          npm ci --prefix website
          npm run build --prefix website
      - name: Retain the unchanged web resources even if a later QA scenario fails
        uses: actions/cache/save@v4
        if: steps.website.outputs.cache-hit != 'true'
        with:
          path: website/dist
          key: sillon-signage-website-1201-20261018
      - name: Prepare Forge sources
        run: |
          chmod +x gradlew
          ./gradlew fabric:setupFiles -PminecraftVersion=1.20.1
          python tools/decor/prepare_resources.py
          ./gradlew forge:setupFiles -PminecraftVersion=1.20.1
      - name: Build Forge 1.20.1
        id: build
        run: ./gradlew forge:build -PminecraftVersion=1.20.1 --stacktrace
      - name: Preserve the exact compile dependencies for local checks
        if: always() && steps.build.outcome != 'skipped'
        run: ./gradlew -I tools/qa/export-classpath.gradle forge:sillonExportClasspath -PminecraftVersion=1.20.1
      - uses: actions/upload-artifact@v4
        if: always() && steps.build.outcome != 'skipped'
        with:
          name: Sillon-Forge-compile-dependencies
          path: forge/build/sillon-classpath/forge-compile-classpath.zip
          retention-days: 3
      - name: Preserve addon ABI compatibility
        run: |
          python tools/patch_sillon_jcm_abi.py
          python tools/patch_sillon_jcm_rail_stats.py
          SILLON_JCM_STRICT=true python tools/test_sillon_jcm_descriptors.py
      - name: Stage the build
        run: |
          mkdir -p build/signage-delivery
          cp forge/build/libs/*-all.jar build/signage-delivery/Sillon-Signaletique-Forge-1.20.1.jar
          sha256sum build/signage-delivery/*.jar > build/signage-delivery/SHA256SUMS.txt
          python tools/verify_signage_jar.py
          python tools/test_builder.py
          python tools/test_chantier.py
          javac --release 17 -cp build/signage-headless/classes:build/signage-delivery/Sillon-Signaletique-Forge-1.20.1.jar -d build/signage-headless/classes tools/signage/SignageMtrIntegration.java
          java -cp build/signage-headless/classes:build/signage-delivery/Sillon-Signaletique-Forge-1.20.1.jar SignageMtrIntegration
      - uses: actions/upload-artifact@v4
        if: always() && steps.build.outcome == 'success'
        with:
          name: Sillon-Chantier-Forge-1.20.1
          path: build/signage-delivery
          if-no-files-found: error
      - name: Prepare the native Minecraft visual test world
        run: |
          python tools/qa/install_signage_visual_qa.py
          python tools/qa/create_signage_world.py
      - name: Capture the real editor and in-world signs
        env:
          LIBGL_ALWAYS_SOFTWARE: 'true'
          ALSOFT_DRIVERS: 'null'
          JAVA_TOOL_OPTIONS: '-Dsillon.qa.previewOnly=true -Dfml.earlyprogresswindow=false'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0
          timeout 1200s xvfb-run -a -s "-screen 0 1920x1200x24" ./gradlew -p tools/qa-runtime runClient -Dorg.gradle.jvmargs=-Xmx3G
          test -f forge/run/chantier-native-qa-success.txt
          test -f forge/run/preview-native-qa-success.txt
      - name: Capture signs with Oculus and Complementary
        env:
          LIBGL_ALWAYS_SOFTWARE: 'true'
          ALSOFT_DRIVERS: 'null'
          JAVA_TOOL_OPTIONS: '-Dsillon.qa.previewOnly=true -Dfml.earlyprogresswindow=false'
        run: |
          python tools/qa/install_signage_shader_qa.py
          cp tools/qa/SignageVisualQa.java tools/qa-runtime/src/main/java/org/sillon/qa/SignageVisualQa.java
          timeout 1200s xvfb-run -a -s "-screen 0 1920x1200x24" ./gradlew -p tools/qa-runtime runClient -Dorg.gradle.jvmargs=-Xmx3G
          test -f forge/run/chantier-shader-qa-success.txt
          test -f forge/run/preview-shader-qa-success.txt
      - name: Preserve native captures
        if: always()
        run: |
          mkdir -p build/signage-qa/native docs/signage/review/native
          cp forge/run/screenshots/preview*.png build/signage-qa/native/ 2>/dev/null || true
          cp forge/run/preview-*-qa-success.txt build/signage-qa/native/ 2>/dev/null || true
          cp forge/run/screenshots/chantier*.png build/signage-qa/native/ 2>/dev/null || true
          cp forge/run/chantier-*-qa-success.txt build/signage-qa/native/ 2>/dev/null || true
          cp forge/run/screenshots/builder*.png build/signage-qa/native/ 2>/dev/null || true
          cp forge/run/builder-*-qa-success.txt build/signage-qa/native/ 2>/dev/null || true
          cp forge/run/screenshots/decor*.png build/signage-qa/native/ 2>/dev/null || true
          cp forge/run/decor-*-qa-success.txt build/signage-qa/native/ 2>/dev/null || true
          cp forge/run/screenshots/signage*.png build/signage-qa/native/ 2>/dev/null || true
          cp forge/run/signage-world-qa-success.txt build/signage-qa/native/ 2>/dev/null || true
          cp forge/run/signage-ui-qa-success.txt build/signage-qa/native/ 2>/dev/null || true
          cp forge/run/signage-shader-qa-success.txt build/signage-qa/native/ 2>/dev/null || true
          cp forge/run/logs/latest.log build/signage-qa/native/minecraft-latest.log 2>/dev/null || true
          cp -r build/signage-qa/native/* docs/signage/review/native/ 2>/dev/null || true
          git add docs/signage/review/native
          git diff --cached --quiet || git commit -m "qa(signage): capture the native Minecraft editor and physical signs"
          git push origin HEAD:${{ github.ref_name }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Sillon-Chantier-visual-checks
          path: |
            build/signage-qa
            build/decor-review
            docs/signage/reference-photos.jpg
