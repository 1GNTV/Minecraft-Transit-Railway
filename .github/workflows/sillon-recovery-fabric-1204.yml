name: Sillon Recovery Fabric 1.20.4 - native port

on:
  push:
    branches: [build/sillon-recovery-fabric-1204-r2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sillon-recovery-fabric-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fabric:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: gradle/actions/setup-gradle@v4
      - name: Cache website resources
        id: website-cache
        uses: actions/cache@v4
        with:
          path: website/dist
          key: solis-website-1.20.4-${{ runner.os }}-${{ hashFiles('website/package-lock.json', 'website/src/**', 'fabric/src/main/java/org/mtr/core/**') }}
      - name: Prepare website resources
        if: steps.website-cache.outputs.cache-hit != 'true'
        run: |
          chmod +x gradlew
          ./gradlew fabric:setupWebsiteFiles -PminecraftVersion=1.20.4
          npm ci --prefix website
          npm run build --prefix website
      - name: Validate engine safety before build
        run: |
          python3 tools/test_solis_gpu_wiring.py
          python3 tools/test_sillon_shadow_budget.py
          python3 tools/test_fusion_engine.py
      - name: Generate Fabric 1.20.4 sources
        run: |
          chmod +x gradlew
          ./gradlew fabric:setupFiles -PminecraftVersion=1.20.4
      - name: Build Fabric 1.20.4
        run: ./gradlew fabric:build -PminecraftVersion=1.20.4 --stacktrace
      - name: Locate production Fabric JAR
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t jars < <(find fabric/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-dev.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' ! -name '*-all.jar' | sort)
          test "${#jars[@]}" -eq 1
          echo "SILLON_JAR_PATH=${jars[0]}" >> "$GITHUB_ENV"
      - name: Patch and strictly verify JCM mixin ABI on the Fabric JAR
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/patch_sillon_jcm_abi.py
          python3 tools/patch_sillon_jcm_rail_stats.py
          SILLON_JCM_STRICT=true python3 tools/test_sillon_jcm_descriptors.py
      - name: Verify Fabric production metadata
        run: python3 tools/verify_strata_fabric_1204_jar.py "$SILLON_JAR_PATH"
      - name: Stage and checksum test artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/fabric-delivery
          cp "$SILLON_JAR_PATH" build/fabric-delivery/Sillon-Recovery-TEST-Fabric-1.20.4.jar
          cd build/fabric-delivery
          sha256sum Sillon-Recovery-TEST-Fabric-1.20.4.jar > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Sillon-Recovery-Fabric-1.20.4
          path: build/fabric-delivery/
          if-no-files-found: error
          retention-days: 14
