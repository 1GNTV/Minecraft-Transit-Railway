name: Sillon signage - Forge build and visual checks
on:
  push:
    branches: [work/sillon-signage-refonte-forge-1201]
    paths-ignore: [docs/**, .github/workflows/signage-preparation.yml, tools/prepare_signage_assets.py]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: signage-refonte-forge
  cancel-in-progress: true
jobs:
  forge:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
      - run: pip install pillow pymupdf
      - name: Complete real reference material and the offline map
        run: python tools/complete_signage_refs.py
      - name: Render and exercise the actual compositor and editor model
        run: python tools/test_sillon_signage_reference.py
      - uses: actions/cache@v4
        id: website
        with:
          path: website/dist
          key: sillon-signage-website-1201-20261018
      - name: Website resources
        if: steps.website.outputs.cache-hit != 'true'
        run: |
          chmod +x gradlew
          ./gradlew fabric:setupWebsiteFiles -PminecraftVersion=1.20.1
          npm ci --prefix website
          npm run build --prefix website
      - name: Prepare Forge sources
        run: |
          chmod +x gradlew
          ./gradlew fabric:setupFiles -PminecraftVersion=1.20.1
          ./gradlew forge:setupFiles -PminecraftVersion=1.20.1
      - name: Build Forge 1.20.1
        run: ./gradlew forge:build -PminecraftVersion=1.20.1 --stacktrace
      - name: Preserve addon ABI compatibility
        run: |
          python tools/patch_sillon_jcm_abi.py
          python tools/patch_sillon_jcm_rail_stats.py
          SILLON_JCM_STRICT=true python tools/test_sillon_jcm_descriptors.py
      - name: Stage the build
        run: |
          mkdir -p build/signage-delivery
          cp forge/build/libs/*-all.jar build/signage-delivery/Sillon-Signaletique-Forge-1.20.1.jar
          sha256sum build/signage-delivery/*.jar > build/signage-delivery/SHA256SUMS.txt
      - name: Publish QA images for review
        if: always()
        run: |
          mkdir -p docs/signage/review
          cp -r build/signage-qa/* docs/signage/review/ 2>/dev/null || true
          git config user.name "Sillon build"
          git config user.email "48333136+1GNTV@users.noreply.github.com"
          git add docs/signage fabric/src/main/resources/assets/mtr/signage/maps
          git diff --cached --quiet || git commit -m "qa(signage): preserve real references and rendered panel review"
          git push origin HEAD:work/sillon-signage-refonte-forge-1201
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Sillon-signage-visual-checks
          path: |
            build/signage-qa
            docs/signage/reference-photos.jpg
      - uses: actions/upload-artifact@v4
        with:
          name: Sillon-Signaletique-Forge-1.20.1
          path: build/signage-delivery
          if-no-files-found: error
