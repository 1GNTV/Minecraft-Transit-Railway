name: Sillon Forge 1.20.1 performance build
on:
  push:
    branches: [ "perf/forge-1201", "perf/forge-1201-v4", "work/mtr-v4-optimization", "work/mtr-engine-persistent-scene", "work/mtr-engine-max-perf", "work/mtr-engine-oculus-startup-fix", "work/mtr-engine-render-overhaul", "work/mtr-engine-queue-hotpath-v2", "work/mtr-engine-v3-100fps-scene-shadow", "work/mtr-engine-v4-fusion-scene-rail-train", "release/mtrium-glacier-final", "work/sillon-aurora-170" ]
  workflow_dispatch:

# Each new development push supersedes the preceding unverified build.
concurrency:
  group: mtr-engine-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  shader-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install software OpenGL test support
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Compare ordinary and instanced shader pixels
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a python3 tools/test_oculus_gl.py
  forge-1201:
    needs: shader-bridge
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check generic attribute cache boundaries
        run: python3 tools/test_attribute_cache.py
      - name: Check asynchronous render diagnostics
        run: python3 tools/test_render_diagnostics.py
      - name: Check rail sector budgets and ownership
        run: python3 tools/test_rail_sector_cache.py
      - name: Check CPU image and GPU buffer ownership
        run: python3 tools/test_resource_lifecycle.py
      - name: Check frame-time analysis
        run: python3 tools/test_frame_times.py
      - name: Check next renderer instances and frame lifetimes
        run: python3 tools/test_next_renderer.py
      - name: Check persistent MTR Engine scene plans
        run: python3 tools/test_scene_engine.py
      - name: Check V4 fused scene, GPU region and train transform caches
        run: python3 tools/test_fusion_engine.py
      - name: Check GLACIER rail-column diff and classic draw batching
        run: python3 tools/test_glacier_finish.py
      - name: Verify memoized scene keys and compiled page hashes
        run: python3 tools/test_glacier_hash_hotpath.py
      - name: Verify cross-frame stopped-train door scan reuse and PSD side effects
        run: python3 tools/test_glacier_stopped_doors.py
      - name: Verify retained rail plans and exception-free displays are actually wired
        run: python3 tools/test_glacier_retained_rails_displays.py
      - name: Verify stable sector GPU page selections are really reused
        run: python3 tools/test_glacier_sector_lists.py
      - name: Verify next GLACIER real queue bypass and all four GPU/shadow/LOD paths
        run: python3 tools/test_glacier_next_generation.py
      - name: Verify corrected rail lighting pipeline under Sillon AURORA
        run: python3 tools/test_sillon_rail_lighting.py
      - name: Check Oculus startup-safe mixin registration
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          config=json.loads(Path('forge/src/main/resources/mtr.performance.mixins.json').read_text())
          assert 'OculusInstanceShaderMixin' not in config['client'], 'Unsafe @ModifyArgs shader injector must stay disabled on Forge'
          assert 'BatchInstancingMixin' in config['client'], 'Unrelated optimizations must be retained'
          print('PASS: no Oculus @ModifyArgs; CPU/GPU performance mixins intact')
          PY
      - name: Check compiled region cache stable-frame fast path
        run: python3 tools/test_region_cache_hotpath.py
      - name: Check persistent visible-rail reuse and invalidation
        run: python3 tools/test_rail_visibility_cache.py
      - name: Check exact-frame MTR rail light caching
        run: python3 tools/test_rail_light_cache.py
      - name: Check retained mesh upload implementation
        run: python3 tools/test_region_mesh_uploader.py
      - name: Check RTX indirect renderer and shader fallbacks
        run: python3 tools/test_gpu_indirect.py
      - name: Check dense static station membership stability
        run: python3 tools/test_dense_regions.py
      - name: Check allocation-free rail lookup and cache identity
        run: python3 tools/test_rail_lookup_engine.py
      - name: Check shader integration and persistent region content
        run: python3 tools/test_next_architecture.py
      - name: Check live shadow state and deadline resource expiry
        run: |
          python3 tools/test_profile_hotspots.py
          python3 tools/test_fps_fixes.py
          python3 tools/test_detail_async.py
      - name: Build web resources
        run: |
          chmod +x gradlew
          ./gradlew fabric:setupWebsiteFiles -PminecraftVersion=1.20.1
          npm ci --prefix website
          npm run build --prefix website
      - name: Prepare common and Forge sources
        run: |
          ./gradlew fabric:setupFiles -PminecraftVersion=1.20.1
          ./gradlew forge:setupFiles -PminecraftVersion=1.20.1
      - name: Compile optimized MTR Forge
        run: ./gradlew forge:build -PminecraftVersion=1.20.1 --stacktrace
      - name: Verify final shaded Forge artifact
        run: python3 tools/verify_work_jar.py
      - name: Enforce JCM 2.3.0-beta.1 exact Mixin ABI before publishing
        run: SILLON_JCM_STRICT=true python3 tools/test_sillon_jcm_descriptors.py
      - name: Upload geometry test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MTR-v4-geometry-test-reports
          path: forge/build/reports/tests/test/
          if-no-files-found: ignore
      - name: Publish Sillon GLACIER Final or AURORA research JAR
        if: github.ref == 'refs/heads/release/mtrium-glacier-final' || github.ref == 'refs/heads/work/sillon-aurora-170'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          build="b${GITHUB_RUN_NUMBER}-r${GITHUB_RUN_ATTEMPT}"
          extra=()
          if [[ "$GITHUB_REF" == "refs/heads/release/mtrium-glacier-final" ]]; then
            tag="v4.0.1-SILLON-GLACIER-FINAL"
            jar="Sillon-GLACIER-FINAL-Forge-1.20.1.jar"
            title="Sillon — GLACIER FINAL (Forge 1.20.1)"
            cat > RELEASE_NOTES.md <<'EOF'
          Sillon GLACIER FINAL: the last release in the GLACIER family, based on the b147 engine.\n          Sillon is the project name; the original MTR mod ID, Java packages and binary compatibility hooks are preserved for existing addons, especially Joban Client Mod.
          
          All MAX experimental paths are enabled by default, with explicit JVM `-D...=false` controls:
          `mtr.engine.shaderIndirect`, `mtr.engine.shadowRailCull`,
          `mtr.engine.railLod`, `mtr.next.shaderLod`,
          `mtr.engine.classicGpu`, `mtr.next.textAcrossCallbacks`.
          Persistent scene replay, stopped-door caching, hashed scene plans,
          retained GPU sector lists and live lighting remain enabled.
          
          Verified by CI: unit/integration tests, software-GL shader bridge tests,
          full Forge 1.20.1 build and shaded JAR validation.
          b147 MAX was user-benchmarked at approximately 129 FPS shown, with
          reports of peaks around 142 FPS and comparable results without JVM flags.
          Those FPS are observational, not a controlled proof of gains from individual flags.
          
          Keep b134/b147 as backups. The full default-on combination still has
          compatibility risks with particular shader packs, third-party addons and
          train models. If visual glitches occur, disable the relevant feature via
          `-Dmtr.engine.<feature>=false` and report the scenario. Not a guarantee
          that the mod is free of all bugs.
          EOF
          else
            tag="v5.0.0-AURORA-${build}"
            jar="Sillon-AURORA-${build}-Forge-1.20.1.jar"
            title="Sillon AURORA — ${build} (170 FPS research)"
            extra+=(--prerelease)
            cat > RELEASE_NOTES.md <<'EOF'
          Sillon AURORA is the successor to GLACIER Final. It also corrects cached rail lightmap render-layer handling while preserving the GPU cache (rollback: `-Dsillon.aurora.railExteriorLighting=false`). AURORA explores removal of
          remaining MTR submission and region-cache CPU costs, with compatibility gates for Joban Client Mod mixin injection signatures. The observed
          170 FPS without visible MTR elements is a reference scene, not a
          guaranteed result with active railway geometry and shaders.
          All GLACIER Final optimizations and reversible toggles are retained.
          This is an experimental build: compare with GLACIER Final, inspect
          actual rendered rails/trains/shadows, and capture Spark + latest.log.
          EOF
          fi
          mapfile -t candidates < <(find forge/build/libs -maxdepth 1 -type f -name '*-all.jar' | sort)
          if [ "${#candidates[@]}" -ne 1 ]; then
            echo "Expected exactly one shaded Forge JAR, found ${#candidates[@]}" >&2
            exit 1
          fi
          cp "${candidates[0]}" "$jar"
          sha256sum "$jar" > "$jar.sha256"
          gh release create "$tag" "$jar" "$jar.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$title" --notes-file RELEASE_NOTES.md "${extra[@]}"
