name: Forge 1.20.1 performance build
on:
  push:
    branches: [ "perf/forge-1201", "perf/forge-1201-v4", "work/mtr-v4-optimization" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forge-1201:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check generic attribute cache boundaries
        run: python3 tools/test_attribute_cache.py
      - name: Build web resources
        run: |
          chmod +x gradlew
          ./gradlew fabric:setupWebsiteFiles -PminecraftVersion=1.20.1
          npm ci --prefix website
          npm run build --prefix website
      - name: Prepare common and Forge sources
        run: |
          ./gradlew fabric:setupFiles -PminecraftVersion=1.20.1
          ./gradlew forge:setupFiles -PminecraftVersion=1.20.1
      - name: Compile optimized MTR Forge
        run: ./gradlew forge:build -PminecraftVersion=1.20.1 --stacktrace
      - name: Verify final shaded Forge artifact
        run: python3 tools/verify_work_jar.py
      - name: Upload geometry test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MTR-v4-geometry-test-reports
          path: forge/build/reports/tests/test/
          if-no-files-found: ignore
      - name: Upload Forge jar
        uses: actions/upload-artifact@v4
        with:
          name: MTR-v4-work-forge-1.20.1
          path: |
            forge/build/libs/*-all.jar
          if-no-files-found: error
