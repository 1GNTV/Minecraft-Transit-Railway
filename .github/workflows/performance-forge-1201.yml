name: Forge 1.20.1 performance build
on:
  push:
    branches: [ "perf/forge-1201", "perf/forge-1201-v4", "work/mtr-v4-optimization", "work/mtr-engine-persistent-scene", "work/mtr-engine-max-perf", "work/mtr-engine-oculus-startup-fix", "work/mtr-engine-render-overhaul", "work/mtr-engine-queue-hotpath-v2", "work/mtr-engine-v3-100fps-scene-shadow", "work/mtr-engine-v4-fusion-scene-rail-train" ]
  workflow_dispatch:

# Each new development push supersedes the preceding unverified build.
concurrency:
  group: mtr-engine-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  shader-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install software OpenGL test support
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Compare ordinary and instanced shader pixels
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a python3 tools/test_oculus_gl.py
  forge-1201:
    needs: shader-bridge
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check generic attribute cache boundaries
        run: python3 tools/test_attribute_cache.py
      - name: Check asynchronous render diagnostics
        run: python3 tools/test_render_diagnostics.py
      - name: Check rail sector budgets and ownership
        run: python3 tools/test_rail_sector_cache.py
      - name: Check CPU image and GPU buffer ownership
        run: python3 tools/test_resource_lifecycle.py
      - name: Check frame-time analysis
        run: python3 tools/test_frame_times.py
      - name: Check next renderer instances and frame lifetimes
        run: python3 tools/test_next_renderer.py
      - name: Check persistent MTR Engine scene plans
        run: python3 tools/test_scene_engine.py
      - name: Check V4 fused scene, GPU region and train transform caches
        run: python3 tools/test_fusion_engine.py
      - name: Check GLACIER rail-column diff and classic draw batching
        run: python3 tools/test_glacier_finish.py
      - name: Verify memoized scene keys and compiled page hashes
        run: python3 tools/test_glacier_hash_hotpath.py
      - name: Check Oculus startup-safe mixin registration
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          config=json.loads(Path('forge/src/main/resources/mtr.performance.mixins.json').read_text())
          assert 'OculusInstanceShaderMixin' not in config['client'], 'Unsafe @ModifyArgs shader injector must stay disabled on Forge'
          assert 'BatchInstancingMixin' in config['client'], 'Unrelated optimizations must be retained'
          print('PASS: no Oculus @ModifyArgs; CPU/GPU performance mixins intact')
          PY
      - name: Check compiled region cache stable-frame fast path
        run: python3 tools/test_region_cache_hotpath.py
      - name: Check persistent visible-rail reuse and invalidation
        run: python3 tools/test_rail_visibility_cache.py
      - name: Check exact-frame MTR rail light caching
        run: python3 tools/test_rail_light_cache.py
      - name: Check retained mesh upload implementation
        run: python3 tools/test_region_mesh_uploader.py
      - name: Check RTX indirect renderer and shader fallbacks
        run: python3 tools/test_gpu_indirect.py
      - name: Check dense static station membership stability
        run: python3 tools/test_dense_regions.py
      - name: Check allocation-free rail lookup and cache identity
        run: python3 tools/test_rail_lookup_engine.py
      - name: Check shader integration and persistent region content
        run: python3 tools/test_next_architecture.py
      - name: Check live shadow state and deadline resource expiry
        run: |
          python3 tools/test_profile_hotspots.py
          python3 tools/test_fps_fixes.py
          python3 tools/test_detail_async.py
      - name: Build web resources
        run: |
          chmod +x gradlew
          ./gradlew fabric:setupWebsiteFiles -PminecraftVersion=1.20.1
          npm ci --prefix website
          npm run build --prefix website
      - name: Prepare common and Forge sources
        run: |
          ./gradlew fabric:setupFiles -PminecraftVersion=1.20.1
          ./gradlew forge:setupFiles -PminecraftVersion=1.20.1
      - name: Compile optimized MTR Forge
        run: ./gradlew forge:build -PminecraftVersion=1.20.1 --stacktrace
      - name: Verify final shaded Forge artifact
        run: python3 tools/verify_work_jar.py
      - name: Upload geometry test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MTR-v4-geometry-test-reports
          path: forge/build/reports/tests/test/
          if-no-files-found: ignore
      - name: Publish GLACIER experimental JAR directly to GitHub Releases
        if: github.ref == 'refs/heads/work/mtr-engine-v4-fusion-scene-rail-train'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          build="b${GITHUB_RUN_NUMBER}-r${GITHUB_RUN_ATTEMPT}"
          tag="v4.0.0-GLACIER-${build}"
          jar="MTR-V4-GLACIER-${build}-Forge-1.20.1.jar"
          mapfile -t candidates < <(find forge/build/libs -maxdepth 1 -type f -name '*-all.jar' | sort)
          if [ "${#candidates[@]}" -ne 1 ]; then
            echo "Expected exactly one shaded Forge JAR, found ${#candidates[@]}" >&2
            exit 1
          fi
          cp "${candidates[0]}" "$jar"
          sha256sum "$jar" > "$jar.sha256"
          gh release create "$tag" "$jar" "$jar.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "MTR Engine V4 — GLACIER (${build}, Experimental)" \
            --notes "EXPERIMENTAL: GLACIER hash-hotpath update memoizes rail location, scene-plan, fragment and compiled page selection hashes; reuses plan keys across shader/main passes. Includes E1+E2 GPU region invalidation, train frame transforms and classic rail batching. Optional retained classic GPU pages: -Dmtr.engine.classicGpu=true (OFF by default pending visual tests). Forge 1.20.1. Automated checks and build passed before publication; no in-game FPS/Oculus/JCM guarantee. Keep V2 ALPINE as stable fallback." \
            --prerelease
