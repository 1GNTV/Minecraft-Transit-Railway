name: Sillon - shader validation of assembled Forge JAR
on:
  push:
    branches: [work/sillon-shader-validation-22dc70b]
    paths: [.github/workflows/builder-shader-validation.yml, tools/qa/BuilderVisualQa.java]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: sillon-shader-validation
  cancel-in-progress: true
jobs:
  shader:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - uses: actions/download-artifact@v4
        with:
          name: Sillon-Builder-Forge-1.20.1
          run-id: 39467210492
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: build/signage-delivery
      - name: Verify the exact production JAR
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path("build/signage-delivery/Sillon-Signaletique-Forge-1.20.1.jar")
          assert hashlib.sha256(p.read_bytes()).hexdigest()=="2ee0b3be2115ff2b7a42d230d6cb699049c88fc46daa977ee63ad5a8de43c625"
          print("Validated production JAR: 22dc70b, 102189966 bytes")
          PY
      - name: Prepare the isolated Minecraft shader test
        run: |
          chmod +x gradlew
          mkdir -p build/signage-qa
          cp docs/signage/review/fixtures-commands.txt docs/signage/review/reference-commands.txt build/signage-qa/
          python tools/qa/install_signage_visual_qa.py
          python tools/qa/create_signage_world.py
          python tools/qa/install_signage_shader_qa.py
      - name: Run every shader scenario against the assembled JAR
        env:
          LIBGL_ALWAYS_SOFTWARE: 'true'
          ALSOFT_DRIVERS: 'null'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0
          timeout 600s xvfb-run -a -s "-screen 0 1280x800x24" ./gradlew -p tools/qa-runtime runClient -Dorg.gradle.jvmargs=-Xmx3G
          test -f forge/run/signage-shader-qa-success.txt
          test -f forge/run/decor-shader-qa-success.txt
          test -f forge/run/builder-shader-qa-success.txt
          test -f forge/run/builder-next-shader-qa-success.txt
      - name: Preserve the actual shader captures
        if: always()
        run: |
          mkdir -p build/shader-validation docs/signage/review/native
          cp forge/run/screenshots/*.png build/shader-validation/ 2>/dev/null || true
          cp forge/run/*-qa-success.txt build/shader-validation/ 2>/dev/null || true
          cp forge/run/logs/latest.log build/shader-validation/minecraft-latest.log 2>/dev/null || true
          cp build/signage-qa/shader-runtime.json build/shader-validation/ 2>/dev/null || true
          cp -r build/shader-validation/* docs/signage/review/native/ 2>/dev/null || true
          git config user.name "Sillon build"
          git config user.email "48333136+1GNTV@users.noreply.github.com"
          git add docs/signage/review/native
          git diff --cached --quiet || git commit -m "qa(shader): preserve exact-JAR shader captures"
          git push origin HEAD:work/sillon-shader-validation-22dc70b
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Sillon-Shader-Validation-22dc70b
          path: build/shader-validation
          if-no-files-found: warn
