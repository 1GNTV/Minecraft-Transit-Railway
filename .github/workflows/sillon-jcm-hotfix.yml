name: Sillon AURORA fast JCM crash hotfix
on:
  # Manual only: this hotfix was tied to the immutable b156 binary and tag.
  # All subsequent commits use the full AURORA build/release workflow.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-prior-jar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Reuse byte-for-byte compiled AURORA b156 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p forge/build/libs
          gh release download v5.0.0-AURORA-b156-r1 --repo "$GITHUB_REPOSITORY" --pattern 'Sillon-AURORA-b156-r1-Forge-1.20.1.jar*' --dir forge/build/libs
          cd forge/build/libs
          sha256sum --check Sillon-AURORA-b156-r1-Forge-1.20.1.jar.sha256
          mv Sillon-AURORA-b156-r1-Forge-1.20.1.jar forge-4.0.5-all.jar
      - name: Restore missing live JCM rail-gradient callback
        run: python3 tools/patch_sillon_jcm_rail_stats.py
      - name: Check expanded Joban 2.3.0-beta.1 mixin ABI
        run: SILLON_JCM_STRICT=true python3 tools/test_sillon_jcm_descriptors.py
      - name: Validate real shaded JAR
        run: python3 tools/verify_work_jar.py
      - name: Release patched JAR for Minecraft test
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp forge/build/libs/forge-4.0.5-all.jar Sillon-AURORA-b156-JCM-HOTFIX-Forge-1.20.1.jar
          sha256sum Sillon-AURORA-b156-JCM-HOTFIX-Forge-1.20.1.jar > Sillon-AURORA-b156-JCM-HOTFIX-Forge-1.20.1.jar.sha256
          gh release create "v5.0.1-AURORA-JCM-HOTFIX" \
            Sillon-AURORA-b156-JCM-HOTFIX-Forge-1.20.1.jar \
            Sillon-AURORA-b156-JCM-HOTFIX-Forge-1.20.1.jar.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Sillon AURORA b156 JCM rail-gradient crash hotfix" \
            --notes "Built from the original b156 release without recompilation. Restores the real RenderRails.lambda\$renderRailStats\$24 callback targeted by Joban Client Mod 2.3.0-beta.1. All optimized rendering remains unchanged. A full runtime compatibility test is still required."
