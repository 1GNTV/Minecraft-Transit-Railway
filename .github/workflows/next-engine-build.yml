name: Sillon NEXT — Forge 1.20.1 and Fabric 1.20.4 experimental builds

on:
  push:
    branches:
      - work/sillon-next-forge-1201
      - work/sillon-next-fabric-1204
  workflow_dispatch:
    inputs:
      release_candidate:
        description: "Run strict release gate (must fail until all features verified)"
        type: boolean
        default: false

concurrency:
  group: next-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  forge:
    if: github.ref == 'refs/heads/work/sillon-next-forge-1201'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: gradle/actions/setup-gradle@v4
      - name: Cache website resources
        id: solis-website-cache
        uses: actions/cache@v4
        with:
          path: website/dist
          key: solis-website-1.20.1-${{ runner.os }}-${{ hashFiles('website/package-lock.json', 'website/src/**', 'fabric/src/main/java/org/mtr/core/**') }}
      - name: Website resources
        if: steps.solis-website-cache.outputs.cache-hit != 'true'
        run: |
          chmod +x gradlew
          ./gradlew fabric:setupWebsiteFiles -PminecraftVersion=1.20.1
          npm ci --prefix website
          npm run build --prefix website
      - name: Prepare Forge 1.20.1 sources
        run: |
          ./gradlew fabric:setupFiles -PminecraftVersion=1.20.1
          ./gradlew forge:setupFiles -PminecraftVersion=1.20.1
      - name: Check camera culling regression
        run: |
          python3 tools/test_next_rail_forward.py
          python3 tools/test_next_render_safety.py
          python3 tools/test_next_benchmark.py
      - name: Build NEXT experimental Forge
        run: ./gradlew forge:build -PminecraftVersion=1.20.1 --stacktrace
      - name: Preserve JCM compatibility
        run: |
          python3 tools/patch_sillon_jcm_abi.py
          python3 tools/patch_sillon_jcm_rail_stats.py
          SILLON_JCM_STRICT=true python3 tools/test_sillon_jcm_descriptors.py
      - name: Stage NEXT experimental Forge JAR
        run: |
          set -euo pipefail
          mkdir -p build/next
          mapfile -t jars < <(find forge/build/libs -maxdepth 1 -type f -name '*-all.jar')
          test "${#jars[@]}" -eq 1
          cp "${jars[0]}" build/next/Sillon-NEXT-EXPERIMENTAL-Forge-1.20.1.jar
          sha256sum build/next/Sillon-NEXT-EXPERIMENTAL-Forge-1.20.1.jar > build/next/Sillon-NEXT-EXPERIMENTAL-Forge-1.20.1.jar.sha256
      - name: Upload NEXT experimental Forge JAR
        uses: actions/upload-artifact@v4
        with:
          name: Sillon-NEXT-EXPERIMENTAL-Forge-1.20.1
          path: build/next/*
          if-no-files-found: error
      - name: Release candidate gate (all features and both platforms)
        if: github.event_name == 'workflow_dispatch' && inputs.release_candidate == true
        run: python3 tools/check_next_release_gate.py
      - name: Verify NEXT experimental JAR
        run: python3 tools/verify_work_jar.py

  fabric:
    if: github.ref == 'refs/heads/work/sillon-next-fabric-1204'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: gradle/actions/setup-gradle@v4
      - name: Cache website resources
        id: solis-website-cache
        uses: actions/cache@v4
        with:
          path: website/dist
          key: solis-website-1.20.4-${{ runner.os }}-${{ hashFiles('website/package-lock.json', 'website/src/**', 'fabric/src/main/java/org/mtr/core/**') }}
      - name: Website resources
        if: steps.solis-website-cache.outputs.cache-hit != 'true'
        run: |
          chmod +x gradlew
          ./gradlew fabric:setupWebsiteFiles -PminecraftVersion=1.20.4
          npm ci --prefix website
          npm run build --prefix website
      - name: Validate SOLIS PANAM model and bulletin timeline
        run: |
          python3 tools/test_panam_pixel.py
          python3 tools/test_panam_camera_order.py
          python3 tools/test_panam_eta_contrast.py
          python3 tools/test_panam_arrival_parity.py
          python3 tools/test_panam_lifecycle.py
          python3 tools/test_panam_shader_space.py
          python3 tools/test_panam_config_ui.py
          python3 tools/test_panam_network_feed.py
      - name: Prepare Fabric 1.20.4 sources
        run: |
          ./gradlew fabric:setupFiles -PminecraftVersion=1.20.4
      - name: Check GPU backend wiring
        run: python3 tools/test_solis_gpu_wiring.py
      - name: Check camera culling regression
        run: |
          python3 tools/test_next_rail_forward.py
          python3 tools/test_next_render_safety.py
          python3 tools/test_next_benchmark.py
      - name: Build NEXT experimental Fabric
        run: ./gradlew fabric:build -PminecraftVersion=1.20.4 --stacktrace
      - name: Preserve JCM compatibility
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t jars < <(find fabric/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-dev.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' ! -name '*-all.jar' | sort)
          test "${#jars[@]}" -eq 1
          SILLON_JAR_PATH="${jars[0]}" python3 tools/patch_sillon_jcm_abi.py
          SILLON_JAR_PATH="${jars[0]}" python3 tools/patch_sillon_jcm_rail_stats.py
          SILLON_JAR_PATH="${jars[0]}" SILLON_JCM_STRICT=true python3 tools/test_sillon_jcm_descriptors.py
          echo "SILLON_JAR_PATH=${jars[0]}" >> "$GITHUB_ENV"
      - name: Stage NEXT experimental Fabric JAR
        run: |
          set -euo pipefail
          mkdir -p build/next
          cp "$SILLON_JAR_PATH" build/next/Sillon-NEXT-EXPERIMENTAL-Fabric-1.20.4.jar
          sha256sum build/next/Sillon-NEXT-EXPERIMENTAL-Fabric-1.20.4.jar > build/next/Sillon-NEXT-EXPERIMENTAL-Fabric-1.20.4.jar.sha256
      - name: Upload NEXT experimental Fabric JAR
        uses: actions/upload-artifact@v4
        with:
          name: Sillon-NEXT-EXPERIMENTAL-Fabric-1.20.4
          path: build/next/*
          if-no-files-found: error
      - name: Release candidate gate (all features and both platforms)
        if: github.event_name == 'workflow_dispatch' && inputs.release_candidate == true
        run: python3 tools/check_next_release_gate.py
      - name: Verify NEXT experimental Fabric JAR
        run: python3 tools/verify_strata_fabric_1204_jar.py "$SILLON_JAR_PATH"
