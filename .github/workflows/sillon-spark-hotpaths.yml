name: Sillon Spark hotpaths - Forge 1.20.1 verification
on:
  push:
    branches: [fix/sillon-spark-hotpaths-20261024]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sillon-spark-hotpaths-${{ github.ref }}
  cancel-in-progress: true

jobs:
  forge:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare website resources
        run: |
          chmod +x gradlew
          ./gradlew fabric:setupWebsiteFiles -PminecraftVersion=1.20.1
          npm ci --prefix website
          npm run build --prefix website
      - name: Prepare Forge 1.20.1 dependencies
        run: |
          ./gradlew fabric:setupFiles -PminecraftVersion=1.20.1
          ./gradlew forge:setupFiles -PminecraftVersion=1.20.1
      - name: Validate render safety
        run: |
          python3 tools/test_next_render_safety.py
          python3 tools/test_next_benchmark.py
      - name: Compile Forge 1.20.1
        run: ./gradlew forge:build -PminecraftVersion=1.20.1 --stacktrace
      - name: Restore exact JCM mixin ABI in the compiled Forge JAR
        run: |
          python3 tools/patch_sillon_jcm_abi.py
          python3 tools/patch_sillon_jcm_rail_stats.py
          SILLON_JCM_STRICT=true python3 tools/test_sillon_jcm_descriptors.py
      - name: Stage test JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/spark-hotpaths
          mapfile -t jars < <(find forge/build/libs -maxdepth 1 -type f -name '*-all.jar')
          test "${#jars[@]}" -eq 1
          cp "${jars[0]}" build/spark-hotpaths/Sillon-SparkHotpaths-TEST-Forge-1.20.1.jar
          sha256sum build/spark-hotpaths/*.jar > build/spark-hotpaths/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Sillon-SparkHotpaths-Forge-1.20.1
          path: build/spark-hotpaths/
          if-no-files-found: error
