name: Port 1.21.1 - upstream MTR 4.1 baseline

on:
  push:
    branches:
      - work/sillon-trio-fabric-1211
    paths:
      - .github/workflows/port-1211-mtr41-baseline.yml
      - docs/SILLON-TRIO-1211.md
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  baseline:
    name: Compile MTR 4.1.0-beta.2 Fabric 1.21.1 upstream
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: sillon
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
      - uses: gradle/actions/setup-gradle@v4
      - name: Fetch pinned upstream MTR 4.1 Stonecutter source
        run: |
          git clone --depth 1 --branch stonecutter https://github.com/Minecraft-Transit-Railway/Minecraft-Transit-Railway.git upstream
          git -C upstream checkout f05d99efab6f27b3868913438fce2da381e5798f
      - name: Select Fabric 1.21.1 target
        working-directory: upstream
        run: |
          # Source is authored for 1.21.4. Keep vcsVersion=1.21.4; Stonecutter
          # must actually SWITCH the source to 1.21.1, not just edit a property.
          sed -i 's/gradle-9.5.1-bin.zip/gradle-9.7.0-bin.zip/' gradle/wrapper/gradle-wrapper.properties
          # The newest Fletching Table plugin no longer exposes modrinth() in this build script.
          # Use Mod Menu's Fabric 1.21.1 Maven artifact directly for this isolated target.
          sed -i 's@modImplementation(fletchingTable.modrinth("modmenu", sc.current.version))@modImplementation("maven.modrinth:modmenu:11.0.3")@' build-fabric.gradle.kts
          chmod +x gradlew
      - name: Switch Stonecutter Java source to 1.21.1
        working-directory: upstream
        shell: bash
        timeout-minutes: 8
        run: |
          set -o pipefail
          ./gradlew "Set active project to 1.21.1-fabric" --no-daemon --stacktrace 2>&1 | tee ../upstream-mtr41-1211.log
      - name: Generate MTR 1.21.1 sources
        working-directory: upstream
        shell: bash
        timeout-minutes: 10
        run: |
          set -o pipefail
          ./gradlew :1.21.1-fabric:setupFiles --no-daemon --stacktrace 2>&1 | tee -a ../upstream-mtr41-1211.log
      - name: Compile MTR 1.21.1 vanilla baseline
        working-directory: upstream
        shell: bash
        timeout-minutes: 15
        run: |
          set -o pipefail
          ./gradlew :1.21.1-fabric:build -x test --no-daemon --stacktrace 2>&1 | tee -a ../upstream-mtr41-1211.log
      - name: Preserve vanilla MTR 4.1 baseline, if compiled
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MTR41-Fabric-1211-vanilla-baseline-NOT-SILLON
          path: |
            upstream/versions/1.21.1-fabric/build/libs/*.jar
            upstream/build/release/*.jar
          if-no-files-found: error
      - name: Apply Sillon editor rail optimization to MTR 4.1
        run: python3 sillon/tools/ports_1211/patch_mtr41_sillon.py upstream
      - name: Compile first Sillon rail optimization on 1.21.1
        working-directory: upstream
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :1.21.1-fabric:build -x test --no-daemon --stacktrace 2>&1 | tee -a ../upstream-mtr41-1211.log
      - name: Preserve first Sillon rail optimization prototype
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Sillon-1211-EDITOR-CACHE-PROTOTYPE-NOT-SOLIS
          path: |
            upstream/versions/1.21.1-fabric/build/libs/*.jar
            upstream/build/release/*.jar
          if-no-files-found: error
      - name: Preserve baseline build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MTR41-Fabric-1211-baseline-log
          path: upstream-mtr41-1211.log
          if-no-files-found: ignore
