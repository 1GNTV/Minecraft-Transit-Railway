name: SILLON PANAM PIXEL Fabric 1.20.4 experimental build

on:
  push:
    branches: [ "work/sillon-panam-hanging-fabric-1204" ]
  workflow_dispatch:

concurrency:
  group: sillon-strata-fabric1204-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  fabric-1204:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: gradle/actions/setup-gradle@v4

      - name: Verify Fabric performance mixin registration and JCM target anchors
        run: |
          python3 tools/test_strata_fabric_1204.py
          python3 tools/test_strata_contract.py
          python3 tools/test_strata_vehicle_positions.py

      - name: Verify PANAM pixel appearance, line-colour footer and atlas lifecycle
        run: |
          python3 tools/test_panam_pixel.py
          python3 tools/test_panam_lifecycle.py

      - name: Cache generated web resources
        id: assets
        uses: actions/cache@v4
        with:
          path: website/dist
          key: sillon-strata-fabric-1204-web-v1-${{ runner.os }}-${{ hashFiles('website/package-lock.json', 'website/src/**', 'fabric/src/main/java/org/mtr/core/**') }}
      - name: Generate web resources
        if: steps.assets.outputs.cache-hit != 'true'
        run: |
          chmod +x gradlew
          ./gradlew fabric:setupWebsiteFiles -PminecraftVersion=1.20.4
          npm ci --prefix website
          npm run build --prefix website

      - name: Generate Fabric 1.20.4 source and metadata
        run: |
          chmod +x gradlew
          ./gradlew fabric:setupFiles -PminecraftVersion=1.20.4

      - name: Build and remap STRATA Fabric 1.20.4
        run: ./gradlew fabric:build -PminecraftVersion=1.20.4 --stacktrace

      - name: Restore actual Fabric JCM 2.2.5 callback ABI
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t candidates < <(find fabric/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-dev.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' ! -name '*-all.jar' | sort)
          test "${#candidates[@]}" -eq 1
          echo "SILLON_JAR_PATH=${candidates[0]}" >> "$GITHUB_ENV"
          SILLON_JAR_PATH="${candidates[0]}" python3 tools/patch_sillon_jcm_abi.py
          SILLON_JAR_PATH="${candidates[0]}" python3 tools/patch_sillon_jcm_rail_stats.py
          SILLON_JAR_PATH="${candidates[0]}" SILLON_JCM_STRICT=true python3 tools/test_sillon_jcm_descriptors.py

      - name: Verify shaded Fabric 1.20.4 mod and exported STRATA engine
        shell: bash
        run: python3 tools/verify_strata_fabric_1204_jar.py "$SILLON_JAR_PATH"

      - name: Publish an experimental Fabric 1.20.4 single-JAR release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="b${GITHUB_RUN_NUMBER}-r${GITHUB_RUN_ATTEMPT}"
          tag="v1.5.0-PANAM-HANGING-FABRIC-1204-${version}"
          artifact="Sillon-PANAM-HANGING-${version}-Fabric-1.20.4.jar"
          cp "$SILLON_JAR_PATH" "$artifact"
          sha256sum "$artifact" > "$artifact.sha256"
          gh release create "$tag" "$artifact" "$artifact.sha256" \
            --target "$GITHUB_SHA" --prerelease \
            --title "SILLON PANAM PIXEL ${version} — Fabric 1.20.4 (experimental)" \
            --notes-file docs/STRATA-FABRIC-1204.md
