name: Sillon SOLIS — Forge and Fabric builds

on:
  push:
    branches:
      - work/sillon-solis-forge-1201
      - work/sillon-solis-fabric-1204
  workflow_dispatch:

concurrency:
  group: solis-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  forge:
    if: github.ref == 'refs/heads/work/sillon-solis-forge-1201'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: gradle/actions/setup-gradle@v4
      - name: Cache website resources
        id: solis-website-cache
        uses: actions/cache@v4
        with:
          path: website/dist
          key: solis-website-1.20.1-${{ runner.os }}-${{ hashFiles('website/package-lock.json', 'website/src/**', 'fabric/src/main/java/org/mtr/core/**') }}
      - name: Website resources
        if: steps.solis-website-cache.outputs.cache-hit != 'true'
        run: |
          chmod +x gradlew
          ./gradlew fabric:setupWebsiteFiles -PminecraftVersion=1.20.1
          npm ci --prefix website
          npm run build --prefix website
      - name: Prepare Forge 1.20.1 sources
        run: |
          ./gradlew fabric:setupFiles -PminecraftVersion=1.20.1
          ./gradlew forge:setupFiles -PminecraftVersion=1.20.1
      - name: Build SOLIS Forge
        run: ./gradlew forge:build -PminecraftVersion=1.20.1 --stacktrace
      - name: Preserve JCM compatibility
        run: |
          python3 tools/patch_sillon_jcm_abi.py
          python3 tools/patch_sillon_jcm_rail_stats.py
          SILLON_JCM_STRICT=true python3 tools/test_sillon_jcm_descriptors.py
      - name: Stage SOLIS Forge JAR
        run: |
          set -euo pipefail
          mkdir -p build/solis
          mapfile -t jars < <(find forge/build/libs -maxdepth 1 -type f -name '*-all.jar')
          test "${#jars[@]}" -eq 1
          cp "${jars[0]}" build/solis/Sillon-SOLIS-Forge-1.20.1.jar
          sha256sum build/solis/Sillon-SOLIS-Forge-1.20.1.jar > build/solis/Sillon-SOLIS-Forge-1.20.1.jar.sha256
      - name: Upload SOLIS Forge JAR
        uses: actions/upload-artifact@v4
        with:
          name: Sillon-SOLIS-Forge-1.20.1
          path: build/solis/*
          if-no-files-found: error
      - name: Verify SOLIS JAR
        run: python3 tools/verify_work_jar.py

  fabric:
    if: github.ref == 'refs/heads/work/sillon-solis-fabric-1204'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: gradle/actions/setup-gradle@v4
      - name: Cache website resources
        id: solis-website-cache
        uses: actions/cache@v4
        with:
          path: website/dist
          key: solis-website-1.20.4-${{ runner.os }}-${{ hashFiles('website/package-lock.json', 'website/src/**', 'fabric/src/main/java/org/mtr/core/**') }}
      - name: Website resources
        if: steps.solis-website-cache.outputs.cache-hit != 'true'
        run: |
          chmod +x gradlew
          ./gradlew fabric:setupWebsiteFiles -PminecraftVersion=1.20.4
          npm ci --prefix website
          npm run build --prefix website
      - name: Prepare Fabric 1.20.4 sources
        run: |
          ./gradlew fabric:setupFiles -PminecraftVersion=1.20.4
      - name: Build SOLIS Fabric
        run: ./gradlew fabric:build -PminecraftVersion=1.20.4 --stacktrace
      - name: Preserve JCM compatibility
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t jars < <(find fabric/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-dev.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' ! -name '*-all.jar' | sort)
          test "${#jars[@]}" -eq 1
          SILLON_JAR_PATH="${jars[0]}" python3 tools/patch_sillon_jcm_abi.py
          SILLON_JAR_PATH="${jars[0]}" python3 tools/patch_sillon_jcm_rail_stats.py
          SILLON_JAR_PATH="${jars[0]}" SILLON_JCM_STRICT=true python3 tools/test_sillon_jcm_descriptors.py
          echo "SILLON_JAR_PATH=${jars[0]}" >> "$GITHUB_ENV"
      - name: Stage SOLIS Fabric JAR
        run: |
          set -euo pipefail
          mkdir -p build/solis
          cp "$SILLON_JAR_PATH" build/solis/Sillon-SOLIS-Fabric-1.20.4.jar
          sha256sum build/solis/Sillon-SOLIS-Fabric-1.20.4.jar > build/solis/Sillon-SOLIS-Fabric-1.20.4.jar.sha256
      - name: Upload SOLIS Fabric JAR
        uses: actions/upload-artifact@v4
        with:
          name: Sillon-SOLIS-Fabric-1.20.4
          path: build/solis/*
          if-no-files-found: error
      - name: Verify SOLIS Fabric JAR
        run: python3 tools/verify_strata_fabric_1204_jar.py "$SILLON_JAR_PATH"
