plugins {
    id "java"
    id "net.minecraftforge.gradle" version "6.+"
}
version="1.0"
java.toolchain.languageVersion=JavaLanguageVersion.of(17)
minecraft {
    mappings channel:"official",version:"1.20.1"
    runs {
        configureEach {
            workingDirectory project.file("../../forge/run")
            property "forge.logging.console.level","info"
            property "mixin.env.remapRefMap","true"
            property "mixin.env.refMapRemappingFile",project.file("build/createSrgToMcp/output.srg").absolutePath
            mods { signageqa { source sourceSets.main } }
        }
        client {
            args "--quickPlaySingleplayer","SignageQA"
            jvmArgs "-Xmx3G"
        }
        server { args "--nogui";jvmArgs "-Xmx3G" }
    }
}
repositories {
    maven { url uri("../../build/qa-maven") }
    maven { url "https://api.modrinth.com/maven/" }
}
dependencies {
    minecraft "net.minecraftforge:forge:1.20.1-47.4.28"
    implementation fg.deobf("org.sillon:tested-build:1.0")
}

// Production refmaps use SRG members; the isolated Forge development runtime uses official names.
tasks.matching { it.name in ["runClient","runServer"] }.configureEach { dependsOn "createSrgToMcp" }
